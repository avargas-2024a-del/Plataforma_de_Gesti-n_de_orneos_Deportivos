# ============================================================
# docker-compose.yml — Plataforma de Gestión de Torneos Deportivos
# ============================================================
services:
  postgres:
    image: postgres:16-alpine
    container_name: torneos_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-torneos_deportivos}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-torneos_deportivos}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - torneos_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: torneos_backend
    restart: unless-stopped
    env_file: []
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/torneos_deportivos?schema=public"
      PORT: "3001"
      NODE_ENV: production
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - torneos_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: torneos_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - torneos_net

volumes:
  postgres_data:
    driver: local

networks:
  torneos_net:
    driver: bridge